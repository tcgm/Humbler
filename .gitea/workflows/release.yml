# Push a version tag (v1.2.3, matching package.json) to build and publish a
# Gitea release:
#   Windows  Humbler-Setup-<v>.exe (full), Humbler-QuickSetup-<v>.exe (one-click), zip
#            built on Linux, in electron-builder's image with Wine
#   Linux    AppImage, tar.gz
#   macOS    dmg + zip, only if you have a Mac runner: set the repository
#            variable MAC_RUNNER to its label (e.g. "macos")
#
# Nothing about the server is written here: its address and the repository
# come from the runner (gitea.server_url, gitea.repository), the token from
# a secret. This file is public on GitHub too, so keep it that way.
#
# Optional repository variable RELEASE_FEED: the update feed built into the
# app (e.g. the public GitHub one). Unset: Gitea-built copies don't check.
#
# Uploads with the job's own automatic token; nothing to set up. Only if
# your Gitea refuses that token release access, add a repository secret
# RELEASE_TOKEN (an access token with repository read and write) and it's
# used instead. Signing secrets as on GitHub (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    env:
      TAG: ${{ gitea.ref_name }}
      HUMBLER_RELEASE_FEED: ${{ vars.RELEASE_FEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG doesn't match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - name: Package for Linux
        run: node scripts/package.mjs linux
      - name: Package for Windows
        run: node scripts/package.mjs win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Publish to the release
        shell: bash
        env:
          GITEA_URL: ${{ gitea.server_url }}
          GITEA_REPO: ${{ gitea.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || gitea.token }}
        run: |
          shopt -s nullglob
          files=(release/*/*.exe release/*/*.zip release/*/*.AppImage release/*/*.tar.gz)
          (cd "$(dirname "${files[0]}")" && sha256sum $(for f in "${files[@]}"; do basename "$f"; done) > SHA256SUMS-windows-linux.txt)
          node scripts/gitea-release.mjs "$TAG" "${files[@]}" "$(dirname "${files[0]}")/SHA256SUMS-windows-linux.txt"

  mac:
    if: ${{ vars.MAC_RUNNER != '' }}
    runs-on: ${{ vars.MAC_RUNNER }}
    env:
      TAG: ${{ gitea.ref_name }}
      HUMBLER_RELEASE_FEED: ${{ vars.RELEASE_FEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package for macOS
        run: node scripts/package.mjs mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Publish to the release
        shell: bash
        env:
          GITEA_URL: ${{ gitea.server_url }}
          GITEA_REPO: ${{ gitea.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || gitea.token }}
        run: |
          shopt -s nullglob
          files=(release/*/*.dmg release/*/*.zip)
          (cd "$(dirname "${files[0]}")" && shasum -a 256 $(for f in "${files[@]}"; do basename "$f"; done) > SHA256SUMS-mac.txt)
          node scripts/gitea-release.mjs "$TAG" "${files[@]}" "$(dirname "${files[0]}")/SHA256SUMS-mac.txt"
