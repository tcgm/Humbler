# Push a version tag (v1.2.3, matching package.json) to build every platform
# and publish a GitHub release with all the files:
#   Windows  Humbler-Setup-<v>.exe (full), Humbler-QuickSetup-<v>.exe (one-click), zip
#   Linux    AppImage, tar.gz
#   macOS    dmg + zip, Intel (x64) and Apple Silicon (arm64)
# A tag with a hyphen (v1.2.0-beta.1) becomes a prerelease, which installed
# copies don't announce as an update.
#
# Signing is off until these repository secrets exist (see docs/RELEASING.md):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD             Windows certificate (.pfx, base64)
#   CSC_LINK, CSC_KEY_PASSWORD                     Apple Developer ID certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   macOS notarization
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG doesn't match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - name: Package
        shell: bash
        run: node scripts/package.mjs ${{ matrix.target }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: humbler-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.tar.gz
            release/*/*.dmg
            release/*/*.blockmap
            release/*/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          find dist -type f -exec mv {} dist/ \; 2>/dev/null || true
          cd dist && find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Humbler ${TAG#v}" --generate-notes $pre
          fi
